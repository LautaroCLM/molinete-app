<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b100e" />
    <title>Sin conexión · Molinete</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: #0b100e radial-gradient(60rem 28rem at 85% -8%, rgba(59, 232, 164, 0.09), transparent 70%);
        color: #e6ebe8; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      main { max-width: 22rem; }
      img { width: 84px; height: 84px; }
      h1 { margin: 16px 0 6px; font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; color: #8d9a94; line-height: 1.5; }
      button {
        margin-top: 22px; padding: 12px 24px; border: 0; border-radius: 12px; cursor: pointer;
        font: inherit; font-weight: 600; color: #03150c;
        background-image: linear-gradient(135deg, #3be8a4, #11a66b);
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-molinete.png" alt="" />
      <h1>Sin conexión</h1>
      <p>No pudimos conectarnos a Molinete. Revisá tu conexión a internet y probá de nuevo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
    <script>
      // Al volver la conexión, recarga sola.
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
